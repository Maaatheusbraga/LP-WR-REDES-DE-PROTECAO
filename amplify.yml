version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo '' > "$NVM_DIR/default-packages"
        - nvm install 22
        - nvm alias default 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - nvm use 22
        - node -v
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
